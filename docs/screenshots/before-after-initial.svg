<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><rect width="1200" height="600" fill="#f3f4f8"/><foreignObject x="0" y="0" width="600" height="600"><div xmlns="http://www.w3.org/1999/xhtml"><style>*{box-sizing:border-box}.app{width:520px;margin:24px auto;padding:28px 32px;background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(31,35,51,.08);font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:#1f2333}.header h1{margin:0;font-size:1.8rem}.subtitle{margin:.25rem 0 1.5rem;color:#6b7085}.add-form{display:flex;gap:.5rem}.add-form input{flex:1;padding:.65rem .9rem;border:1px solid #d5d8e3;border-radius:10px;font:inherit}.add-form button{padding:.65rem 1.2rem;border:none;border-radius:10px;background:#5b5bd6;color:#fff;font:inherit;font-weight:600}.filter-bar{display:flex;align-items:center;gap:.5rem;margin:1.25rem 0 .75rem;color:#6b7085}.filter-bar select{padding:.35rem .6rem;border-radius:8px;border:1px solid #d5d8e3;font:inherit}.task-list{list-style:none;margin:0;padding:0}.task{display:flex;justify-content:space-between;align-items:center;padding:.7rem .25rem;border-bottom:1px solid #eef0f5}.task label{display:flex;align-items:center;gap:.6rem}.task.done span{text-decoration:line-through;color:#9a9fb2}.delete{border:none;background:none;color:#b0b4c4;font:inherit}.empty{color:#9a9fb2;text-align:center;padding:1rem 0}.stats{margin-top:1.5rem;padding-top:1rem;border-top:1px solid #eef0f5;color:#4a4f63}.stats p{margin:.2rem 0}.progress{height:8px;margin-top:.75rem;background:#eef0f5;border-radius:999px;overflow:hidden}.progress-bar{height:100%;background:linear-gradient(90deg,#5b5bd6,#2bb5a0)}.lbl{font:600 15px system-ui,Arial,sans-serif;text-align:center;margin-top:8px}</style><div class="lbl" style="color:#e5484d">❌ Before (buggy-version)</div><div xmlns="http://www.w3.org/1999/xhtml" class="app"><header class="header"><h1>Task Manager</h1><p class="subtitle">You have  tasks</p></header><form class="add-form"><input placeholder="What needs to be done?" aria-label="New task" value="" /><button type="submit">Add</button></form><div class="filter-bar"><label for="filter">Show:</label><select id="filter"><option value="all" selected="">All</option><option value="active">Active</option><option value="done">Completed</option></select></div><ul class="task-list"><li class="task done"><label><input type="checkbox" checked="" /><span>Install React Developer Tools</span></label><button class="delete" aria-label="Delete Install React Developer Tools">✕</button></li><li class="task"><label><input type="checkbox" /><span>Inspect the component tree</span></label><button class="delete" aria-label="Delete Inspect the component tree">✕</button></li><li class="task"><label><input type="checkbox" /><span>Fix the bugs</span></label><button class="delete" aria-label="Delete Fix the bugs">✕</button></li></ul><section class="stats"><p>Completed: <strong>3</strong> / 3</p><p>Remaining: <strong>0</strong></p><div class="progress" aria-label="100% complete"><div class="progress-bar" style="width: 100%;"></div></div></section></div></div></foreignObject><foreignObject x="600" y="0" width="600" height="600"><div xmlns="http://www.w3.org/1999/xhtml"><style>*{box-sizing:border-box}.app{width:520px;margin:24px auto;padding:28px 32px;background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(31,35,51,.08);font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:#1f2333}.header h1{margin:0;font-size:1.8rem}.subtitle{margin:.25rem 0 1.5rem;color:#6b7085}.add-form{display:flex;gap:.5rem}.add-form input{flex:1;padding:.65rem .9rem;border:1px solid #d5d8e3;border-radius:10px;font:inherit}.add-form button{padding:.65rem 1.2rem;border:none;border-radius:10px;background:#5b5bd6;color:#fff;font:inherit;font-weight:600}.filter-bar{display:flex;align-items:center;gap:.5rem;margin:1.25rem 0 .75rem;color:#6b7085}.filter-bar select{padding:.35rem .6rem;border-radius:8px;border:1px solid #d5d8e3;font:inherit}.task-list{list-style:none;margin:0;padding:0}.task{display:flex;justify-content:space-between;align-items:center;padding:.7rem .25rem;border-bottom:1px solid #eef0f5}.task label{display:flex;align-items:center;gap:.6rem}.task.done span{text-decoration:line-through;color:#9a9fb2}.delete{border:none;background:none;color:#b0b4c4;font:inherit}.empty{color:#9a9fb2;text-align:center;padding:1rem 0}.stats{margin-top:1.5rem;padding-top:1rem;border-top:1px solid #eef0f5;color:#4a4f63}.stats p{margin:.2rem 0}.progress{height:8px;margin-top:.75rem;background:#eef0f5;border-radius:999px;overflow:hidden}.progress-bar{height:100%;background:linear-gradient(90deg,#5b5bd6,#2bb5a0)}.lbl{font:600 15px system-ui,Arial,sans-serif;text-align:center;margin-top:8px}</style><div class="lbl" style="color:#2b9a66">✅ After (fixed)</div><div xmlns="http://www.w3.org/1999/xhtml" class="app"><header class="header"><h1>Task Manager</h1><p class="subtitle">You have 3 tasks</p></header><form class="add-form"><input placeholder="What needs to be done?" aria-label="New task" value="" /><button type="submit">Add</button></form><div class="filter-bar"><label for="filter">Show:</label><select id="filter"><option value="all" selected="">All</option><option value="active">Active</option><option value="done">Completed</option></select></div><ul class="task-list"><li class="task done"><label><input type="checkbox" checked="" /><span>Install React Developer Tools</span></label><button class="delete" aria-label="Delete Install React Developer Tools">✕</button></li><li class="task"><label><input type="checkbox" /><span>Inspect the component tree</span></label><button class="delete" aria-label="Delete Inspect the component tree">✕</button></li><li class="task"><label><input type="checkbox" /><span>Fix the bugs</span></label><button class="delete" aria-label="Delete Fix the bugs">✕</button></li></ul><section class="stats"><p>Completed: <strong>1</strong> / 3</p><p>Remaining: <strong